version: 2
updates:
  # Actions fixadas por SHA: o Dependabot atualiza o SHA e o comentário de versão
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Provider azurerm (required_providers + .terraform.lock.hcl)
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
