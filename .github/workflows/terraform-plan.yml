name: "Terraform Plan"

on:
  pull_request:
    branches:
      - homol

permissions: {}

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_CLOUD_ORGANIZATION: "DiazTech"
  TF_WORKSPACE: "hcp-azure"
  CONFIG_DIRECTORY: "./"

jobs:
  terraform:
    if: github.repository != 'hashicorp-education/learn-terraform-github-actions'
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read        # checkout do repositório
      pull-requests: write  # comentário com o resultado do plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: plan-upload
        with:
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: plan-run
        with:
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: plan-output
        with:
          token: ${{ secrets.TF_API_TOKEN }}
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

      - name: Update PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: plan-comment
        env:
          # Valores passados via env (e não interpolados no script) para evitar script injection
          PLAN_ADD: ${{ steps.plan-output.outputs.add }}
          PLAN_CHANGE: ${{ steps.plan-output.outputs.change }}
          PLAN_DESTROY: ${{ steps.plan-output.outputs.destroy }}
          RUN_LINK: ${{ steps.plan-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { PLAN_ADD, PLAN_CHANGE, PLAN_DESTROY, RUN_LINK } = process.env;
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Cloud Plan Output')
            });
            const output = `#### Terraform Cloud Plan Output
               \`\`\`
               Plan: ${PLAN_ADD} to add, ${PLAN_CHANGE} to change, ${PLAN_DESTROY} to destroy.
               \`\`\`
               [Terraform Cloud Plan](${RUN_LINK})
               `;
            // 2. Delete previous comment so PR timeline makes sense
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }
            // 3. Create the new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
