name: "Terraform Apply"

# Push em main (só deve ocorrer via PR homol -> main, garantido pelo ruleset).
# Gates no HCP Terraform: Wiz run task (post-plan + pre-apply, MANDATORY).
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: terraform-apply-hcp-azure
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: "DiazTech"
  TF_WORKSPACE: "hcp-azure"
  CONFIG_DIRECTORY: "./"

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Environment "production": em repo público/Team/Enterprise permite exigir reviewers antes do apply.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  (antes: @v3, sem pin)
        with:
          persist-credentials: false

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: apply-upload
        with:
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: apply-run
        with:
          token: ${{ secrets.TF_API_TOKEN }}
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          token: ${{ secrets.TF_API_TOKEN }}
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"

      # GATE: se o Apply foi pulado (run não confirmável, ex.: Wiz bloqueou no post-plan) o job NÃO pode ficar verde.
      - name: Enforce apply result
        if: always() && steps.apply-run.outputs.run_id != ''
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          RUN_ID: ${{ steps.apply-run.outputs.run_id }}
          RUN_LINK: ${{ steps.apply-run.outputs.run_link }}
        run: |
          set -euo pipefail
          API="https://app.terraform.io/api/v2"
          auth=(-H "Authorization: Bearer ${TF_API_TOKEN}" -H "Content-Type: application/vnd.api+json")

          status=$(curl -fsS "${auth[@]}" "${API}/runs/${RUN_ID}" | jq -r '.data.attributes.status')
          echo "Run ${RUN_ID}: ${status}"
          echo "--- Task stages ---"
          curl -fsS "${auth[@]}" "${API}/runs/${RUN_ID}/task-stages" \
            | jq -r '.data[] | "\(.attributes.stage): \(.attributes.status)"'

          if [ "${status}" != "applied" ]; then
            echo "::error::Apply não concluído (status=${status}). Detalhes: ${RUN_LINK}"
            exit 1
          fi
          echo "Apply concluído."
